# Builds an installable APK of the Dostana SPEC app (spec-app/) on GitHub's
# runners, which have the Android SDK. Download it from the run's "Artifacts".
# The APK is signed with the debug key: fine for installing on branch phones,
# not for the Play Store (use EAS / a release key for that).
name: Dostana SPEC APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'spec-app/**'
      - '.github/workflows/spec-apk.yml'

permissions:
  contents: write

concurrency:
  group: spec-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: spec-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: spec-app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build release APK
        working-directory: spec-app/android
        env:
          GRADLE_OPTS: -Xmx4g -Dorg.gradle.jvmargs=-Xmx4g
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=armeabi-v7a,arm64-v8a

      - name: Name the APK
        run: |
          SHORT=$(git rev-parse --short HEAD)
          cp android/app/build/outputs/apk/release/app-release.apk "../dostana-spec-${SHORT}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk ../dostana-spec.apk

      - uses: actions/upload-artifact@v4
        with:
          name: dostana-spec-apk
          path: dostana-spec-*.apk
          retention-days: 30

      # Direct phone download, no login or zip:
      # https://github.com/<owner>/<repo>/releases/download/spec-app-latest/dostana-spec.apk
      - name: Publish to the "spec-app-latest" release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Latest Dostana SPEC ordering app, built from ${GITHUB_SHA::7} on $(date -u +'%Y-%m-%d %H:%M') UTC. On the phone: tap dostana-spec.apk, open it, allow installing from this source."
          gh release view spec-app-latest >/dev/null 2>&1 || \
            gh release create spec-app-latest --prerelease --target "$GITHUB_SHA" \
              --title "Dostana SPEC app (latest)" --notes "$NOTES"
          gh release upload spec-app-latest dostana-spec.apk --clobber
          gh release edit spec-app-latest --notes "$NOTES"

  # Opens the new APK on an Android 14 emulator. Fails if the app is not
  # running after 25 seconds; logcat and a screenshot are saved either way.
  smoke:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/download-artifact@v4
        with:
          name: dostana-spec-apk

      - name: Open the app on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r dostana-spec-*.apk
            adb logcat -c
            adb shell monkey -p com.dostana.spec -c android.intent.category.LAUNCHER 1
            sleep 25
            adb exec-out screencap -p > screen.png
            adb logcat -d > logcat.txt
            grep -nE "FATAL EXCEPTION|ReactNativeJS" -A 12 logcat.txt | head -80 || true
            echo "----- expo / JSI lines -----"
            grep -iE "expo|JSI|ExpoModulesCore|Unable to install" logcat.txt | grep -vE "avc:" | head -80 || true
            adb shell pidof com.dostana.spec

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spec-smoke
          path: |
            logcat.txt
            screen.png

# Builds an installable APK of the Dostana SPEC app (spec-app/) on GitHub's
# runners, which have the Android SDK. Download it from the run's "Artifacts".
# The APK is signed with the debug key: fine for installing on branch phones,
# not for the Play Store (use EAS / a release key for that).
name: Dostana SPEC APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'spec-app/**'
      - '.github/workflows/spec-apk.yml'

concurrency:
  group: spec-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: spec-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: spec-app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build release APK
        working-directory: spec-app/android
        env:
          GRADLE_OPTS: -Xmx4g -Dorg.gradle.jvmargs=-Xmx4g
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=armeabi-v7a,arm64-v8a

      - name: Name the APK
        run: |
          SHORT=$(git rev-parse --short HEAD)
          cp android/app/build/outputs/apk/release/app-release.apk "../dostana-spec-${SHORT}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: dostana-spec-apk
          path: dostana-spec-*.apk
          retention-days: 30

# Installs the latest Dostana SPEC APK on an Android emulator, opens it and
# saves the crash log (logcat) plus a screenshot, so start-up crashes can be
# diagnosed without a phone.
name: Dostana SPEC APK smoke test

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/spec-apk-smoke.yml'
  workflow_run:
    workflows: ['Dostana SPEC APK']
    types: [completed]

jobs:
  smoke:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download latest APK
        run: curl -sSfL -o app.apk "https://github.com/${{ github.repository }}/releases/download/spec-app-latest/dostana-spec.apk"

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r app.apk
            adb logcat -c
            adb shell monkey -p com.dostana.spec -c android.intent.category.LAUNCHER 1
            sleep 25
            adb shell pidof com.dostana.spec || echo "APP NOT RUNNING"
            adb exec-out screencap -p > screen.png
            adb logcat -d > logcat.txt
            grep -nE "FATAL|AndroidRuntime|ReactNativeJS|Exception|Error" logcat.txt | grep -iE "dostana|spec|FATAL|ReactNativeJS|AndroidRuntime" | head -80 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spec-smoke
          path: |
            logcat.txt
            screen.png
